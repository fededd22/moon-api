x-moon: &moon
  build: .
  env_file: .env
  volumes:
    - moon_data:/app/data
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  # مطلوبة فقط ليتمكن السيرفر من تشغيل كود العميل بمستخدم الصندوق الرملي
  cap_add: [SETUID, SETGID]

services:
  api:
    <<: *moon
    environment:
      MODE: api
    ports:
      - "127.0.0.1:8000:8000"   # ضعه خلف Nginx/HTTPS
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    pids_limit: 512
    mem_limit: 2g

  bot:
    <<: *moon
    environment:
      MODE: bot
    depends_on: [api]

volumes:
  moon_data:
